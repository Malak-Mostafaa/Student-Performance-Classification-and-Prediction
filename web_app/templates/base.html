<!-- Main page styling -->
{% load static  %}
<!DOCTYPE html>
<html>
<head>
    <title>Dropout System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
        }

        .navbar {
            background: #0d1b2a;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .left {
            font-size: 26px;
            font-weight: bold;
        }

        .navbar .right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            padding: 30px;
        }

        .logout-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
        }

        body{
            margin: 0;
            font-family: Arial, sans-serif;
            background:linear-gradient(rgba(15, 23, 42, 0.30), rgba(15, 23, 42, 0.30)), url("{% static 'img1.png' %}") no-repeat center center fixed;
            background-size: cover;
        }


    .navbar {
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
}

    

    </style>
</head>
<body>
    <div class="navbar">
        <div class="left">Dropout System</div>

        <div class="right">
            <span>Logged in as: {{ request.user.username }}</span>

            <a href="{% url 'dashboard' %}">Student Dashboard</a>

            {% if request.user.is_staff %}
                <a href="/instructor/dashboard/">Instructor Dashboard</a>
            {% endif %}

            <form method="post" action="{% url 'logout' %}" style="display:inline; margin:0;">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
